name: "CI - Test Templates"
on:
  pull_request:
  workflow_dispatch:

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test release versioning"
        run: python3 -B -m unittest discover -s test/release -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Smoke test ai-tools"
        uses: ./.github/actions/smoke-test
        with:
          template: "ai-tools"
          template-args: '{"projectName":"ai-tools-smoke"}'
